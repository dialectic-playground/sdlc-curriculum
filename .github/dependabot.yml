# Keeps GitHub Actions (SHA-pinned) current. Dependabot does not read
# shared/ci/cross-platform-ci.yml, so CI requires its pins to match .github/workflows/ci.yml:
# when Dependabot bumps an action here, update the template in the same pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # The Python line (3.12) is an organization-wide decision shared with the native CI jobs;
    # Dependabot keeps the digest current but never moves to a new Python minor or major.
    ignore:
      - dependency-name: "library/python"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
