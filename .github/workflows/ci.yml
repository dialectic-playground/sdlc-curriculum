# CI for the curriculum itself.
#
# - Verify (3 OSes): structure, suite shape, normative help text, and every expected-output
#   fixture against the maintainer reference models; BASE-MAKEFILE contract wiring.
# - Consistency: generated assignment/ files match the templates, and the language-repo CI
#   template (shared/ci/) uses exactly the same SHA-pinned actions as this workflow.
# - DCO: Signed-off-by on every pull-request commit.
# - "CI result" is the single check required by the branch ruleset (same name in every repo).
#
# Actions are pinned to full commit SHAs (organization policy); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check curriculum (structure, help text, fixtures)
        run: python shared/tools/check-curriculum.py

      - name: Ensure GNU Make is available
        if: runner.os == 'Windows'
        shell: bash
        run: command -v make || choco install make --no-progress -y

      - name: Check BASE-MAKEFILE contract wiring
        shell: bash
        run: |
          make -C projects/00-hello-world/assignment help
          # An unconfigured hook must fail loudly, never silently succeed.
          if make -C projects/00-hello-world/assignment all; then
            echo "expected 'make all' to fail when DP_BUILD is undefined" >&2
            exit 1
          fi

  consistency:
    name: Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generated assignment/ files match the templates
        run: |
          python tools/scaffold-project.py --force > /dev/null
          git diff --exit-code -- projects/ \
            || { echo "::error::Run 'python3 tools/scaffold-project.py --force' and commit."; exit 1; }

      - name: CI template uses this workflow's SHA-pinned actions
        run: |
          status=0
          template=shared/ci/cross-platform-ci.yml
          if grep -E '^\s*(- )?uses:' "$template" | grep -vqE '@[0-9a-f]{40} # v[0-9]'; then
            echo "::error::$template has an action not pinned as '@<40-hex-sha> # vX.Y.Z'"
            status=1
          fi
          for pin in $(grep -oE '[a-z0-9_.-]+/[a-z0-9_.-]+@[0-9a-f]{40}' "$template" | sort -u); do
            grep -qF "$pin" .github/workflows/ci.yml \
              || { echo "::error::$template pins $pin, which differs from .github/workflows/ci.yml"; status=1; }
          done
          exit "$status"

  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for commit in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author="$(git log -1 --format='%an <%ae>' "$commit")"
            case "$author" in *"[bot]@users.noreply.github.com>") continue ;; esac
            if ! git log -1 --format=%B "$commit" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::Commit $commit is missing 'Signed-off-by: $author' (use git commit -s)"
              status=1
            fi
          done
          exit "$status"

  ci-result:
    name: CI result
    if: always()
    needs: [verify, consistency, dco]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - name: All required jobs passed
        run: echo "All required jobs succeeded or were skipped."
