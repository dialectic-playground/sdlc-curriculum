# Checks every link in the Markdown files weekly (and on demand), so links that break
# outside this repository (other repositories, releases, external sites) are noticed.
name: Links

on:
  schedule:
    - cron: "53 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # lychee runs from its official release binary, verified against the checksum below:
      # the organization's allowed-actions policy does not include lycheeverse/lychee-action.
      - name: Install lychee
        env:
          LYCHEE_VERSION: "0.24.2"
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
        run: |
          archive=lychee-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v$LYCHEE_VERSION/$archive"
          echo "$LYCHEE_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lychee-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Check links in Markdown files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          lychee --version
          lychee --no-progress --max-concurrency 8 --accept 200,206,429 --exclude-loopback \
            --exclude-path .venv './**/*.md'
