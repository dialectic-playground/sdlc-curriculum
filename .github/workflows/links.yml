# Checks every link in the Markdown files weekly (and on demand), so links that break
# outside this repository (other repositories, releases, external sites) are noticed.
name: Links

on:
  schedule:
    - cron: "53 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links in Markdown files
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-concurrency 8 --accept 200,206,429 --exclude-path .venv './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
