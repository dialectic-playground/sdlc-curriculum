# Validates the curriculum itself on Linux, macOS, and Windows:
# structure, suite shape, normative help text, and every expected-output fixture
# (against the maintainer reference models in reference/).
name: Curriculum CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check curriculum (structure, help text, fixtures)
        run: python shared/tools/check-curriculum.py

      - name: Ensure GNU Make is available
        if: runner.os == 'Windows'
        shell: bash
        run: command -v make || choco install make --no-progress -y

      - name: Check BASE-MAKEFILE contract wiring
        shell: bash
        run: |
          make -C projects/00-hello-world/assignment help
          # An unconfigured hook must fail loudly, never silently succeed.
          if make -C projects/00-hello-world/assignment all; then
            echo "expected 'make all' to fail when DP_BUILD is undefined" >&2
            exit 1
          fi
